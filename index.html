    <script>
      // Runs before first paint: apply a stored theme (else tokens.css follows the OS).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
